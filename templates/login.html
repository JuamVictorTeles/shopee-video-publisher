<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Shopee Video Publisher</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f6f6;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;padding:2.5rem;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:100%;max-width:380px}
h1{font-size:1.4rem;margin-bottom:.4rem;color:#ee4d2d}
p.sub{color:#666;font-size:.9rem;margin-bottom:1.5rem}
label{display:block;font-size:.85rem;color:#333;margin:.8rem 0 .3rem}
input{width:100%;padding:.7rem .9rem;border:1px solid #ddd;border-radius:8px;font-size:1rem}
button{width:100%;margin-top:1.4rem;padding:.8rem;background:#ee4d2d;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
button:hover{background:#d73211}
.error{background:#fdecea;color:#b3261e;padding:.7rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
<h1>🎬 Shopee Video Publisher</h1>
<p class="sub">Automação de vídeos para afiliados Shopee</p>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}
<div class="error">{{ m }}</div>{% endfor %}{% endwith %}
<form method="post">
<label>Usuário</label><input name="username" required autocomplete="username">
<label>Senha</label><input name="password" type="password" required autocomplete="current-password">
<button type="submit">Entrar</button>
</form>
</div>
</body>
</html>
